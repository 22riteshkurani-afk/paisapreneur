name: Azure Foundry Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  IMAGE_NAME: paisapreneur
  IMAGE_TAG: ${{ github.sha }}
  ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}

jobs:
  build-and-push:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v5
        with:
          registry: ${{ env.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest

      - name: Confirm image URI
        run: |
          echo "Docker image pushed to: ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"
          echo "If you want, configure Azure Foundry to deploy this image from ACR using the image URI above."

      - name: Optional Azure Foundry deployment notice
        if: ${{ secrets.FOUNDRY_WORKSPACE_ID && secrets.FOUNDRY_ENVIRONMENT_ID }}
        run: |
          echo "Foundry deployment settings are available via secrets."
          echo "Use the pushed image URI in your Azure Foundry app/runtime configuration."
